<!--================ PAGE BANNER =================-->

<section class="page-banner">

<div class="section-title">

<h1>Let's Connect</h1>

<p>
Interested in purchasing an artwork or commissioning one?
Send me a message.
</p>

</div>

</section>

<!--================ CONTACT =================-->

<section id="contact">

<div class="contact-wrapper">

<form id="contactForm" novalidate>

<div class="form-group">

<label for="name">Name</label>

<input type="text" id="name" name="name" placeholder="Your Name">

<span class="error-msg" id="nameError"></span>

</div>

<div class="form-group">

<label for="phone">Phone Number</label>

<input type="tel" id="phone" name="phone" placeholder="Your Phone Number">

<span class="error-msg" id="phoneError"></span>

</div>

<div class="form-group">

<label for="email">Email</label>

<input type="email" id="email" name="email" placeholder="Your Email">

<span class="error-msg" id="emailError"></span>

</div>

<div class="form-group">

<label for="message">Message</label>

<textarea rows="6" id="message" name="message" placeholder="Your Message"></textarea>

<span class="error-msg" id="messageError"></span>

</div>

<button type="submit" id="submitBtn">

<i class="fa-solid fa-paper-plane"></i>

Send Message

</button>

</form>

<div id="formSuccess" class="form-success">

<i class="fa-solid fa-circle-check"></i>

<h3>Message Sent</h3>

<p>Thank you for reaching out. I have received your message and will get back to you soon.</p>

</div>

</div>

</section>
